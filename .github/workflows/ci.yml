name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - run: echo verify
  guard-verify:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - run: echo guard
  trusted-gate:
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
